<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Spiral Drop</title>
<meta name="description" content="Spiral Drop — rotate the tower, thread the gaps, dodge the danger sectors.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<noscript><p style="padding:2rem;font-family:sans-serif">Spiral Drop needs JavaScript to run.</p></noscript>
<div id="app">
  <main id="game-region" aria-label="Spiral Drop playfield">
    <canvas id="gl" aria-hidden="true"></canvas>

    <!-- Play HUD: objective, progress, state, context actions -->
    <div id="hud" hidden>
      <div id="hud-top">
        <div id="hud-objective" role="status"></div>
        <div id="hud-mid">
          <span id="hud-score" aria-label="Score">0</span>
          <span id="hud-progress"></span>
          <span id="hud-streak" title="Smash charge"></span>
          <span id="hud-timer" hidden></span>
        </div>
        <button id="btn-pause" class="chip" aria-label="Pause (Esc)">❚❚</button>
      </div>
      <div id="hud-bottom">
        <button id="btn-rot-left" class="rot-btn" aria-label="Rotate tower left">⟲</button>
        <div id="hud-actions">
          <button id="btn-undo" class="chip" hidden>Undo</button>
          <button id="btn-hint" class="chip" hidden>Hint</button>
        </div>
        <button id="btn-rot-right" class="rot-btn" aria-label="Rotate tower right">⟳</button>
      </div>
      <div id="caption-line" aria-hidden="true"></div>
    </div>

    <div id="countdown" hidden aria-hidden="true"></div>
    <div id="screens"></div>
    <div id="toast" role="status" hidden></div>
    <div id="fatal" hidden></div>
  </main>
</div>
<!-- Accessibility mirrors: live regions for objective, turn, score, errors, results -->
<div id="live" class="sr-only" aria-live="polite"></div>
<div id="live-assertive" class="sr-only" aria-live="assertive"></div>

<script src="src/rules.js"></script>
<script src="src/content.js"></script>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
